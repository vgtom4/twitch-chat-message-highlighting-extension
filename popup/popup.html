<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Highlighter Messages</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">

        <label class="master-toggle">
            <span>Highlighting enabled</span>
            <input type="checkbox" id="enabledToggle">
        </label>

        <div class="field">
            <label for="newUsername" class="section-title">Add new user to highlight</label>
            <div class="add-username-container">
                <input type="text" id="newUsername" placeholder="Username..." autocomplete="off" spellcheck="false">
                <select id="highlightType">
                    <option value="whitelisted" selected>Whitelist</option>
                    <option value="blacklisted">Blacklist</option>
                </select>
                <button id="addUserButton">Add</button>
            </div>
            <p id="newUsernameError" class="error" hidden></p>
        </div>

        <div class="field">
            <div class="badge-row">
                <label for="whitelistColor" class="section-title" style="flex-grow: 1;">Whitelist color</label>
                <input type="color" id="whitelistColor">
            </div>
        </div>

        <div class="field">
            <details id="channelBadgesDetails" class="list-element" open>
                <summary><span id="channelBadgesTitle">This channel</span></summary>
                <div class="badge-list" id="channelBadges"></div>
                <p class="empty-hint" id="channelBadgesHint" hidden></p>
            </details>

            <details id="globalBadgesDetails" class="list-element">
                <summary><span id="globalBadgesCount">0</span> Global badges</summary>
                <div class="badge-list" id="globalBadges"></div>
                <p class="empty-hint" id="globalBadgesHint" hidden>
                    None yet. A badge is recognised as global once it shows up on a
                    second channel.
                </p>
            </details>

            <details id="otherBadgesDetails" class="list-element">
                <summary><span id="otherBadgesCount">0</span> Other channels</summary>
                <div class="badge-list" id="otherBadges"></div>
            </details>
        </div>

        <details id="whitelistDetails" class="list-element">
            <summary><span id="whitelistCount">0</span> Whitelisted users</summary>
            <div class="user-list" id="whitelistUsers"></div>
        </details>

        <details id="blacklistDetails" class="list-element">
            <summary><span id="blacklistCount">0</span> Blacklisted users</summary>
            <div class="user-list" id="blacklistUsers"></div>
        </details>

    </div>

    <script src="../shared.js"></script>
    <script src="popup.js"></script>
</body>

</html>
