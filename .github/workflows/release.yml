name: Auto Version and Release Extension

on:
  push:
    branches:
      - latest
  workflow_dispatch:

env:
  EXTENSION_BASENAME: "twitch-chat-highlighter"

jobs:
  version-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. Gestion de la version (Bump si Push, Réutilisation si Manuel)
      - name: Calcul de la version
        id: bump_version
        run: |
          CURRENT_VER=$(jq -r '.version' manifest.json)
          EVENT_NAME="${{ github.event_name }}"
          
          # Si c'est un lancement manuel : on conserve la version du manifest et on force la réédition de la release
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Déclenchement manuel : recréation de la release v$CURRENT_VER"
            echo "NEW_VERSION=$CURRENT_VER" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Si c'est un push : analyse du message de commit
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")

          if [[ ! "$CURRENT_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CURRENT_VER="${CURRENT_VER}.0.0"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VER"

          if [[ $COMMIT_MSG =~ ^feat:|^refactor: ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [[ $COMMIT_MSG =~ ^fix: ]]; then
            PATCH=$((PATCH + 1))
          else
            echo "Aucun préfixe feat:, refactor: ou fix: détecté. Pas de nouveau release."
            echo "SKIP=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          NEW_VER="${MAJOR}.${MINOR}.${PATCH}"
          echo "NEW_VERSION=$NEW_VER" >> $GITHUB_OUTPUT

          # Mise à jour de manifest.json
          jq --arg ver "$NEW_VER" '.version = $ver' manifest.json > manifest.tmp.json && mv manifest.tmp.json manifest.json

          # Configuration Git pour commiter le changement
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump version to v$NEW_VER [skip ci]"
          git tag -f "v$NEW_VER"
          
          git push origin ${{ github.ref_name }} --tags

      # 2. Signature Firefox (.xpi)
      - name: Signature Firefox avec web-ext
        if: steps.bump_version.outputs.SKIP != 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          npx web-ext sign \
            --channel=unlisted \
            --api-key="$WEB_EXT_API_KEY" \
            --api-secret="$WEB_EXT_API_SECRET"
          
          mv web-ext-artifacts/*.xpi web-ext-artifacts/${{ env.EXTENSION_BASENAME }}-v${{ steps.bump_version.outputs.NEW_VERSION }}.xpi

      # 3. Build ZIP Chrome (.zip)
      - name: Création du ZIP Chrome
        if: steps.bump_version.outputs.SKIP != 'true'
        run: |
          npx web-ext build \
            --artifacts-dir=web-ext-artifacts/chrome-build \
            --filename="${{ env.EXTENSION_BASENAME }}-v${{ steps.bump_version.outputs.NEW_VERSION }}.zip"

      # 4. Publication/Écrasement de la Release GitHub
      - name: Publication de la Release GitHub
        if: steps.bump_version.outputs.SKIP != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump_version.outputs.NEW_VERSION }}"
          overwrite: true # Écrase les anciens fichiers joints s'ils existent déjà
          files: |
            web-ext-artifacts/${{ env.EXTENSION_BASENAME }}-v${{ steps.bump_version.outputs.NEW_VERSION }}.xpi
            web-ext-artifacts/chrome-build/${{ env.EXTENSION_BASENAME }}-v${{ steps.bump_version.outputs.NEW_VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
